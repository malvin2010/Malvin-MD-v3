<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MALVIN MD — WhatsApp Bot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #0f2544 0%, #061225 55%, #01050d 100%);
    color: #eaf3ff;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: linear-gradient(160deg, rgba(20,55,110,0.55), rgba(6,18,40,0.75));
    border: 1px solid rgba(90,160,255,0.25);
    border-radius: 22px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 0 60px rgba(30,110,230,0.25), inset 0 0 40px rgba(30,90,200,0.08);
    backdrop-filter: blur(6px);
  }
  .logo {
    width: 92px;
    height: 92px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: radial-gradient(circle, #3aa0ff 0%, #0a3a75 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 800;
    box-shadow: 0 0 35px rgba(58,160,255,0.55);
  }
  h1 {
    font-size: 28px;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #7ec4ff, #3d8bff, #9fd6ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 6px;
  }
  .subtitle { color: #9db8dd; font-size: 14px; margin-bottom: 22px; }
  .badge {
    display: inline-block;
    background: rgba(58,160,255,0.12);
    border: 1px solid rgba(90,170,255,0.4);
    color: #a9d4ff;
    font-size: 13px;
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: 28px;
  }
  .badge b { color: #6fc3ff; }
  .buttons { display: flex; flex-direction: column; gap: 14px; }
  a.btn {
    display: block;
    text-decoration: none;
    padding: 14px 18px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.3px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  a.btn:hover { transform: translateY(-2px); }
  .btn-primary {
    background: linear-gradient(90deg, #1c6fe0, #3aa0ff);
    color: #ffffff;
    box-shadow: 0 8px 24px rgba(30,110,230,0.45);
  }
  .btn-secondary {
    background: rgba(255,255,255,0.06);
    color: #cfe6ff;
    border: 1px solid rgba(120,180,255,0.35);
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.1); }
  footer { margin-top: 28px; font-size: 12px; color: #6f88ad; }
  footer span { color: #4fa3ff; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">M</div>
    <h1>MALVIN MD</h1>
    <div class="subtitle">Multi-Device WhatsApp Bot • Built by Malvin C</div>
    <div class="badge">✅ Paired by <b>{{PAIRED_COUNT}}+</b> people</div>
    <div class="buttons">
      <a class="btn btn-primary" href="/pair">🔗 Pair Bot</a>
      <a class="btn btn-secondary" href="{{CHANNEL_LINK}}" target="_blank" rel="noopener">📢 Join Channel</a>
      <a class="btn btn-secondary" href="https://wa.me/{{OWNER_NUMBER}}" target="_blank" rel="noopener">💬 Contact Dev</a>
    </div>
    <footer>Powered by Baileys · <span>{{PLUGIN_COUNT}}+ commands</span></footer>
  </div>
</body>
</html>
